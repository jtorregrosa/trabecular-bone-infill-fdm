    <script>
      // Download progress of the engine, sent by the WebAssembly build's
      // shim; the native server sends none, and the bar just waits.
      addEventListener("studio:progress", function (event) {
        var splash = document.getElementById("splash")
        if (!splash) return
        var text = splash.querySelector(".text")
        var p = event.detail
        if (p.done) {
          splash.classList.add("waiting")
          text.textContent = "Starting the engine…"
        } else if (p.total && p.loaded <= p.total) {
          splash.classList.remove("waiting")
          splash.style.setProperty("--progress", p.loaded / p.total)
          text.textContent =
            "Downloading the engine… " +
            Math.round((100 * p.loaded) / p.total) +
            " %"
        } else {
          // Compressed transfer: the size on the wire is not the size read.
          text.textContent =
            "Downloading the engine… " + (p.loaded / 1048576).toFixed(1) + " MB"
        }
      })
    </script>
